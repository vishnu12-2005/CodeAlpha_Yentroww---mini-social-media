{% extends 'base.html' %}
{% block content %}

<div class="comic-card">
    <h1 class="brand-text mb-4" style="font-size: 3rem;">Your Activity ⚡</h1>
    
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
        <a href="/activity/saved/" class="comic-card text-center" style="text-decoration: none; display: block; border-width: 4px; transition: transform 0.2s;">
            <div style="font-size: 3rem; margin-bottom: 10px;">🔖</div>
            <h2 class="brand-text">Saved</h2>
        </a>
        <a href="/activity/yentroww/" class="comic-card text-center" style="text-decoration: none; display: block; border-width: 4px; transition: transform 0.2s;">
            <div style="font-size: 3rem; margin-bottom: 10px;">😯</div>
            <h2 class="brand-text">Yentrowws</h2>
        </a>
        <a href="/activity/abboww/" class="comic-card text-center" style="text-decoration: none; display: block; border-width: 4px; transition: transform 0.2s;">
            <div style="font-size: 3rem; margin-bottom: 10px;">😆</div>
            <h2 class="brand-text">Abbowws</h2>
        </a>
        <a href="/activity/sarlee/" class="comic-card text-center" style="text-decoration: none; display: block; border-width: 4px; transition: transform 0.2s;">
            <div style="font-size: 3rem; margin-bottom: 10px;">😏</div>
            <h2 class="brand-text">Sarlees</h2>
        </a>
        <a href="/activity/comments/" class="comic-card text-center" style="text-decoration: none; display: block; border-width: 4px; transition: transform 0.2s;">
            <div style="font-size: 3rem; margin-bottom: 10px;">💬</div>
            <h2 class="brand-text">Commented</h2>
        </a>
        <a href="/activity/dashboard/" class="comic-card text-center" style="text-decoration: none; display: block; border-width: 4px; transition: transform 0.2s; background: var(--bright-yellow);">
            <div style="font-size: 3rem; margin-bottom: 10px;">📊</div>
            <h2 class="brand-text">Dashboard</h2>
        </a>
    </div>
</div>
{% endblock %}
