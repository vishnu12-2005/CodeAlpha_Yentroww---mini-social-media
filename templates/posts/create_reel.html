{% extends 'base.html' %}
{% load widget_tweaks %}
{% block content %}

<div class="comic-card">
    <div style="display: flex; align-items: center; margin-bottom: 1.5rem;">
        <a href="/reels/" class="comic-btn btn-white" style="padding: 0.5rem; font-size: 1rem; margin-right: 15px;">← Back</a>
        <h1 class="brand-text m-0">Create Reel</h1>
    </div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div style="background: #fff3cd; padding: 10px; border: 2px solid black; border-radius: 8px; margin-bottom: 15px; font-weight: bold;">
            💡 Hint: Keep it under 60 seconds for best reach!
        </div>

        {{ form.caption }}
        
        <div style="position: relative; margin-bottom: 1rem;">
            <label id="reel-upload-label" for="id_video_file" style="display: block; border: 3px dashed var(--bright-yellow); background: var(--deep-black); color: white; text-align: center; padding: 3rem 1rem; cursor: pointer; border-radius: 8px; font-family: var(--font-heading); font-size: 1.2rem; transition: all 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                <div style="font-size: 3rem; margin-bottom: 10px;">🎬</div>
                <span id="upload-text">Upload Video 📎</span>
            </label>
            <div style="display: none;">{{ form.video_file }}</div>
        </div>
        
        <!-- Preview area -->
        <div id="reel-preview" style="display: none; margin-bottom: 1rem; text-align: center; border: 3px solid var(--deep-black); border-radius: 8px; overflow: hidden; background: #111;">
            <video id="reel-preview-video" src="" style="max-width: 100%; max-height: 400px; display: block; margin: 0 auto;" controls></video>
        </div>
        
        <div style="margin-bottom: 1rem;">
            <label class="form-label">Visibility</label>
            {{ form.visibility }}
        </div>

        <button type="submit" class="comic-btn btn-primary" style="width: 100%; font-size: 2rem; margin-top: 1rem;">POST REEL 🔥</button>
    </form>
</div>

<script>
const fileInput = document.getElementById('id_video_file');
if (fileInput) {
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('upload-text').textContent = '✅ ' + file.name;
            
            const previewDiv = document.getElementById('reel-preview');
            const previewVideo = document.getElementById('reel-preview-video');
            
            previewDiv.style.display = 'block';
            previewVideo.src = URL.createObjectURL(file);
        }
    });
}
</script>
{% endblock %}
