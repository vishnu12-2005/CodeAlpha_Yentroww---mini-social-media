{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="comic-card">
    <div style="display: flex; align-items: center; margin-bottom: 1.5rem;">
        <a href="/feed/" class="comic-btn btn-white" style="padding: 0.5rem; font-size: 1rem; margin-right: 15px;">← Back</a>
        <h1 class="brand-text m-0">Create Story</h1>
    </div>

    <form method="post" enctype="multipart/form-data" id="story-form">
        {% csrf_token %}
        
        <div style="position: relative; margin-bottom: 1rem;">
            <label id="story-upload-label" for="id_media_file" style="display: block; border: 3px dashed var(--bright-yellow); background: var(--deep-black); color: white; text-align: center; padding: 3rem 1rem; cursor: pointer; border-radius: 8px; font-family: var(--font-heading); font-size: 1.2rem; transition: all 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                <div style="font-size: 3rem; margin-bottom: 10px;">📎</div>
                <span id="upload-text">Drop image/video or click to upload</span>
            </label>
            {{ form.media_file }}
        </div>

        <!-- Preview area -->
        <div id="story-preview" style="display: none; margin-bottom: 1rem; text-align: center; border: 3px solid var(--deep-black); border-radius: 8px; overflow: hidden; background: #111;">
            <img id="story-preview-img" src="" style="max-width: 100%; max-height: 400px; display: none;">
            <video id="story-preview-video" src="" style="max-width: 100%; max-height: 400px; display: none;" controls></video>
        </div>

        <button type="submit" class="comic-btn btn-primary" style="width: 100%; font-size: 2rem; margin-top: 1rem;">SHARE STORY 🔥</button>
    </form>
</div>

<script>
const fileInput = document.getElementById('id_media_file');
if (fileInput) {
    // Make sure the file input is accessible but styled
    fileInput.style.position = 'absolute';
    fileInput.style.opacity = '0';
    fileInput.style.width = '0';
    fileInput.style.height = '0';
    
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('upload-text').textContent = '✅ ' + file.name;
            
            // Show preview
            const previewDiv = document.getElementById('story-preview');
            const previewImg = document.getElementById('story-preview-img');
            const previewVideo = document.getElementById('story-preview-video');
            
            previewDiv.style.display = 'block';
            
            if (file.type.startsWith('video/')) {
                previewImg.style.display = 'none';
                previewVideo.style.display = 'block';
                previewVideo.src = URL.createObjectURL(file);
            } else {
                previewVideo.style.display = 'none';
                previewImg.style.display = 'block';
                previewImg.src = URL.createObjectURL(file);
            }
        }
    });
}
</script>
{% endblock %}
